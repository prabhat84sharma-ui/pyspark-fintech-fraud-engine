[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-fintech-fraud-engine"
version = "1.0.0"
description = "Large-Scale Distributed FinTech Fraud Detection & Risk Scoring Engine using PySpark, Delta Lake, Spark MLlib, and Trino/Spark SQL"
readme = "README.md"
authors = [
    { name = "Prabhat Sharma", email = "prabhat.sharma.ui@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "pyspark",
    "delta-lake",
    "fraud-detection",
    "fintech",
    "risk-scoring",
    "spark-mllib",
    "data-engineering",
    "lakehouse"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0"
]

[project.urls]
Homepage = "https://github.com/prabhat84sharma-ui/pyspark-fintech-fraud-engine"
Repository = "https://github.com/prabhat84sharma-ui/pyspark-fintech-fraud-engine.git"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
